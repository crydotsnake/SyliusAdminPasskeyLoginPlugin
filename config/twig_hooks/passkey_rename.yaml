sylius_twig_hooks:
    hooks:
        'skrull_sylius_admin_passkey_login.admin.passkey.rename.content.header':
            breadcrumbs:
                template: '@SKrullSyliusAdminPasskeyLoginPlugin/admin/passkey/rename/breadcrumbs.html.twig'
                priority: 100

        'skrull_sylius_admin_passkey_login.admin.passkey.rename.content.header.title_block':
            title:
                template: '@SyliusAdmin/shared/crud/update/content/header/title_block/title.html.twig'
                configuration:
                    header: 'skrull_sylius_admin_passkey_login.ui.rename_passkey'
                priority: 100

        'skrull_sylius_admin_passkey_login.admin.passkey.rename.content.header.title_block.actions':
            show:
                enabled: false
            cancel:
                template: '@SKrullSyliusAdminPasskeyLoginPlugin/admin/passkey/rename/cancel.html.twig'
                priority: 100
