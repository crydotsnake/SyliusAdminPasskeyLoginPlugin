sylius_twig_hooks:
    hooks:
        # Admin login page
        'sylius_admin.security.login.page.content.form':
            passkey_login:
                template: '@SKrullSyliusAdminPasskeyLoginPlugin/admin/security/login/passkey_button.html.twig'
                priority: 50

        # Admin user update page
        'sylius_admin.admin_user.update.content.form.sections#right':
            personal_information:
                template: '@SyliusAdmin/admin_user/form/sections/personal_information.html.twig'
                priority: 100
            passkey_setup:
                template: '@SKrullSyliusAdminPasskeyLoginPlugin/form/sections/passkey_setup.html.twig'
                priority: 0

        # Passkey rename page
        'skrull_sylius_admin_passkey_login.admin.passkey.rename.content.header':
            breadcrumbs:
                template: '@SKrullSyliusAdminPasskeyLoginPlugin/admin/passkey/rename/breadcrumbs.html.twig'
                priority: 100

        'skrull_sylius_admin_passkey_login.admin.passkey.rename.content.header.title_block':
            title:
                template: '@SyliusAdmin/shared/crud/update/content/header/title_block/title.html.twig'
                configuration:
                    header: 'skrull_sylius_admin_passkey_login.ui.rename_passkey'
                priority: 100

        'skrull_sylius_admin_passkey_login.admin.passkey.rename.content.header.title_block.actions':
            show:
                enabled: false
            cancel:
                template: '@SKrullSyliusAdminPasskeyLoginPlugin/admin/passkey/rename/cancel.html.twig'
                priority: 100
